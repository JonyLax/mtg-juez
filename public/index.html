<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F5">
<title>Juez · reglas de Magic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F5; --card:#FFFFFF; --ink:#16202E; --soft:#5A6B80;
  --line:#C9D3DF; --accent:#5B3FA8; --accent-soft:#EDE7FA; --warn:#A8501F;
  --warn-soft:#FAEDE3;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
  --cond:"IBM Plex Sans Condensed",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#12171E; --card:#1A2029; --ink:#E4E9F0; --soft:#93A1B3;
    --line:#29323E; --accent:#A992F0; --accent-soft:#252038; --warn:#E0A06A;
    --warn-soft:#2A2019;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
  min-height:100dvh; display:flex; flex-direction:column;
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
button{font:inherit; color:inherit; cursor:pointer}

/* ---- cabecera ---- */
header{
  position:sticky; top:0; z-index:10; background:var(--paper);
  border-bottom:1px solid var(--line);
  padding:10px max(14px,env(safe-area-inset-left)) 10px max(14px,env(safe-area-inset-right));
  display:flex; align-items:center; gap:12px;
}
.mark{
  font-family:var(--cond); font-weight:700; font-size:20px; letter-spacing:.16em;
  text-transform:uppercase; line-height:1;
}
.mark span{color:var(--accent)}
.ctx{margin-left:auto; display:flex; align-items:center; gap:10px; min-width:0}
.ctx-label{
  font-family:var(--mono); font-size:12px; color:var(--soft);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.linkbtn{
  background:none; border:none; padding:4px 2px; color:var(--accent);
  font-size:13px; text-decoration:underline; text-underline-offset:3px;
}

/* ---- contenedor ---- */
main{
  flex:1; width:100%; max-width:720px; margin:0 auto;
  padding:20px max(14px,env(safe-area-inset-left)) 8px max(14px,env(safe-area-inset-right));
}

/* ---- pantalla de arranque ---- */
.lede{font-family:var(--cond); font-weight:600; font-size:28px; line-height:1.15; margin:6px 0 6px}
.sub{color:var(--soft); font-size:15px; margin:0 0 22px; max-width:44ch}
fieldset{border:none; margin:0 0 22px; padding:0}
legend{
  font-family:var(--mono); font-size:11px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--soft); padding:0 0 10px;
}
.grid{display:grid; gap:8px}
.opt{
  display:flex; align-items:baseline; gap:10px; width:100%; text-align:left;
  background:var(--card); border:1px solid var(--line); border-radius:6px;
  padding:12px 14px; transition:border-color .12s, background .12s;
}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft)}
.opt b{font-weight:600; font-size:15px}
.opt em{font-style:normal; color:var(--soft); font-size:13px}
label.field{display:block; margin-bottom:16px}
label.field > span{
  display:block; font-family:var(--mono); font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--soft); margin-bottom:6px;
}
input[type=text],input[type=password],select,textarea{
  width:100%; font:inherit; font-size:15px; color:var(--ink); background:var(--card);
  border:1px solid var(--line); border-radius:6px; padding:10px 12px;
}
textarea{resize:vertical; min-height:70px}
.hint{font-size:13px; color:var(--soft); margin:6px 0 0}
.primary{
  width:100%; background:var(--accent); color:#fff; border:none; border-radius:6px;
  padding:13px; font-weight:600; font-size:16px;
}
@media (prefers-color-scheme:dark){ .primary{color:#12171E} }
.primary:disabled{opacity:.45; cursor:not-allowed}

/* ---- conversacion ---- */
.log{display:flex; flex-direction:column; gap:18px}
.turn-you{align-self:flex-end; max-width:85%}
.bubble{
  background:var(--accent-soft); border:1px solid var(--line); border-radius:10px 10px 2px 10px;
  padding:10px 13px; font-size:15px;
}
.turn-judge{border-left:2px solid var(--accent); padding-left:14px}
.answer{font-size:16px}
.answer p{margin:0 0 .7em}
.answer p:last-child{margin-bottom:0}
.cardtag{font-family:var(--mono); font-size:.92em; color:var(--accent)}

/* firma de la app: la cita se abre y ensena la regla literal */
.cite{
  font-family:var(--mono); font-size:12px; font-weight:500;
  background:transparent; border:1px solid var(--line); border-radius:3px;
  padding:1px 5px; color:var(--accent); white-space:nowrap;
}
.cite:hover,.cite[aria-expanded="true"]{background:var(--accent-soft); border-color:var(--accent)}
.sources{margin-top:12px; display:flex; flex-direction:column; gap:8px}
.source{
  border-top:1px solid var(--line); padding-top:8px; font-size:14px; color:var(--soft);
}
.source .id{font-family:var(--mono); font-size:12px; color:var(--accent); margin-right:8px}
.hidden{display:none}

.opts{display:flex; flex-direction:column; gap:7px; margin-top:14px}
.optbtn{
  text-align:left; background:var(--card); border:1px solid var(--accent);
  border-radius:6px; padding:10px 13px; font-size:15px;
}
.optbtn:hover{background:var(--accent-soft)}

.flag{
  margin-top:12px; font-size:13px; color:var(--warn); background:var(--warn-soft);
  border-radius:4px; padding:7px 10px;
}
.cards{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap}
.cards a{display:block; width:78px}
.cards img{width:100%; border-radius:4px; display:block}
.cards span{font-size:11px; color:var(--soft); display:block; margin-top:3px; line-height:1.3}

.thinking{font-family:var(--mono); font-size:13px; color:var(--soft)}
.thinking::after{content:"·"; animation:blink 1.1s steps(3,end) infinite}
@keyframes blink{0%{content:"·"}33%{content:"··"}66%{content:"···"}}
@media (prefers-reduced-motion:reduce){ .thinking::after{content:"···"; animation:none} }
.err{color:var(--warn); font-size:14px}

/* ---- barra de escritura ---- */
.composer{
  position:sticky; bottom:0; background:var(--paper); border-top:1px solid var(--line);
  padding:10px max(14px,env(safe-area-inset-left)) max(10px,env(safe-area-inset-bottom));
}
.composer-inner{max-width:720px; margin:0 auto; display:flex; gap:8px; align-items:flex-end}
.composer textarea{min-height:44px; max-height:160px; border-radius:8px}
.send{
  background:var(--accent); color:#fff; border:none; border-radius:8px;
  padding:0 18px; height:44px; font-weight:600; flex:0 0 auto;
}
@media (prefers-color-scheme:dark){ .send{color:#12171E} }
.send:disabled{opacity:.4}
footer{
  max-width:720px; margin:0 auto; padding:10px 14px 20px;
  font-size:12px; color:var(--soft); line-height:1.5;
}
</style>
</head>
<body>

<header>
  <div class="mark">Juez<span>.</span></div>
  <div class="ctx">
    <span class="ctx-label" id="ctxLabel"></span>
    <button class="linkbtn hidden" id="btnChange">Cambiar</button>
  </div>
</header>

<main>
  <!-- Pantalla 1: contexto de la partida -->
  <section id="setup">
    <h1 class="lede">¿En qué estáis jugando?</h1>
    <p class="sub">Las reglas cambian según el formato. Dímelo una vez y no vuelvo a preguntar.</p>

    <fieldset>
      <legend>Formato</legend>
      <div class="grid" id="formats"></div>
    </fieldset>

    <label class="field hidden" id="subWrap">
      <span>Formato concreto</span>
      <select id="subformat">
        <option value="standard">Standard</option>
        <option value="pioneer">Pioneer</option>
        <option value="modern" selected>Modern</option>
        <option value="legacy">Legacy</option>
        <option value="vintage">Vintage</option>
        <option value="pauper">Pauper</option>
      </select>
      <p class="hint">Solo se usa para comprobar si una carta es legal.</p>
    </label>

    <label class="field hidden" id="houseWrap">
      <span>Acuerdos de mesa (opcional)</span>
      <textarea id="houseRules" placeholder="Ej: mulligan gratis el primero, no hay infinitos, proxies permitidas"></textarea>
      <p class="hint">Lo que hayáis pactado en la Rule 0. Nunca sustituye a las reglas del juego.</p>
    </label>

    <label class="field">
      <span>Clave del grupo</span>
      <input type="password" id="clubKey" autocomplete="off" placeholder="la contraseña que os habéis puesto">
      <p class="hint">Evita que gente de fuera gaste la cuota. Se guarda en este dispositivo.</p>
    </label>

    <button class="primary" id="btnStart">Empezar</button>
  </section>

  <!-- Pantalla 2: conversacion -->
  <section id="chat" class="hidden">
    <div class="log" id="log"></div>
  </section>
</main>

<div class="composer hidden" id="composer">
  <div class="composer-inner">
    <textarea id="q" rows="1" placeholder="Escribe la duda. Para citar una carta, ponla entre corchetes dobles: [[Lightning Bolt]]"></textarea>
    <button class="send" id="btnSend">Enviar</button>
  </div>
</div>

<footer id="foot"></footer>

<script>
// ─── Configuración ────────────────────────────────────────────────────────────
// La web y la API viven en el mismo Worker, así que no hay nada que configurar.
const API = "";

const FORMATS = [
  ["commander", "Commander", "Multijugador, 100 cartas, 40 vidas"],
  ["duel",      "Constructed 1 contra 1", "Standard, Pioneer, Modern, Legacy…"],
  ["limited",   "Limitado", "Draft o sellado, mazo de 40"],
  ["2hg",       "Gigante de dos cabezas", "Dos equipos de dos, vidas compartidas"],
  ["casual",    "Casual multijugador", "Todos contra todos"],
];

const S = {
  format: localStorage.getItem("mtg.format") || "",
  subformat: localStorage.getItem("mtg.subformat") || "modern",
  houseRules: localStorage.getItem("mtg.house") || "",
  clubKey: localStorage.getItem("mtg.key") || "",
  history: [],
  busy: false,
};

const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ─── Pantalla de arranque ─────────────────────────────────────────────────────
function paintFormats() {
  $("formats").innerHTML = FORMATS.map(([id, name, desc]) =>
    `<button class="opt" type="button" data-fmt="${id}" aria-pressed="${S.format === id}">
       <b>${name}</b><em>${desc}</em>
     </button>`).join("");
  $("formats").querySelectorAll("[data-fmt]").forEach((b) => {
    b.onclick = () => { S.format = b.dataset.fmt; paintFormats(); syncSetup(); };
  });
}

function syncSetup() {
  $("subWrap").classList.toggle("hidden", S.format !== "duel");
  $("houseWrap").classList.toggle("hidden", S.format !== "commander" && S.format !== "casual");
  $("btnStart").disabled = !S.format;
}

function contextLabel() {
  const f = FORMATS.find(([id]) => id === S.format);
  if (!f) return "";
  return S.format === "duel" ? `${f[1]} · ${S.subformat}` : f[1];
}

function start() {
  S.subformat = $("subformat").value;
  S.houseRules = $("houseRules").value.trim();
  S.clubKey = $("clubKey").value;
  localStorage.setItem("mtg.format", S.format);
  localStorage.setItem("mtg.subformat", S.subformat);
  localStorage.setItem("mtg.house", S.houseRules);
  localStorage.setItem("mtg.key", S.clubKey);

  $("setup").classList.add("hidden");
  $("chat").classList.remove("hidden");
  $("composer").classList.remove("hidden");
  $("btnChange").classList.remove("hidden");
  $("ctxLabel").textContent = contextLabel();
  $("q").focus();
}

// ─── Render de la conversación ────────────────────────────────────────────────
function renderYou(text) {
  const el = document.createElement("div");
  el.className = "turn-you";
  el.innerHTML = `<div class="bubble">${esc(text)
    .replace(/\[\[([^\]\n]{2,80})\]\]/g, '<span class="cardtag">$1</span>')}</div>`;
  $("log").append(el);
  scroll();
}

function renderPending() {
  const el = document.createElement("div");
  el.className = "turn-judge";
  el.innerHTML = '<div class="thinking">Consultando las reglas</div>';
  $("log").append(el);
  scroll();
  return el;
}

/** Convierte [CR 603.3a] en un chip que abre el texto literal de la regla. */
function withCitations(text, sources) {
  const known = new Set(sources.map((s) => s.id));
  return esc(text).replace(/\[(?:CR\s*)?(\d{3}\.\d+[a-z]?)\]/g, (m, id) =>
    known.has(id)
      ? `<button class="cite" type="button" data-rule="${id}" aria-expanded="false">${id}</button>`
      : `<span class="cite">${id}</span>`
  );
}

function renderJudge(el, data) {
  const sources = data.fuentes || [];
  const paras = String(data.texto || "")
    .split(/\n{2,}/)
    .map((p) => `<p>${withCitations(p, sources).replace(/\n/g, "<br>")}</p>`)
    .join("");

  let html = `<div class="answer">${paras}</div>`;

  if (data.confianza === "baja") {
    html += `<div class="flag">Poca confianza: las reglas que he encontrado no cubren bien este caso.
             Si la partida es seria, contrastadlo con un juez o con el documento oficial.</div>`;
  }

  const cards = (data.cartas || []).filter((c) => c.found && c.image);
  if (cards.length) {
    html += `<div class="cards">${cards.map((c) =>
      `<a href="${c.scryfall_uri}" target="_blank" rel="noopener">
         <img src="${c.image}" alt="${esc(c.name)}" loading="lazy">
         <span>${esc(c.printed_name || c.name)}${c.legality && c.legality !== "legal" ? " · " + c.legality : ""}</span>
       </a>`).join("")}</div>`;
  }

  const missing = (data.cartas || []).filter((c) => !c.found);
  if (missing.length) {
    html += `<div class="flag">No encuentro en Scryfall: ${missing.map((c) => esc(c.query)).join(", ")}.
             Revisa el nombre exacto.</div>`;
  }

  if (sources.length) {
    html += `<div class="sources">${sources.map((s) =>
      `<div class="source hidden" data-src="${s.id}">
         <span class="id">${s.id}</span>${esc(s.text)}
       </div>`).join("")}</div>`;
  }

  if (data.tipo === "clarificacion" && (data.opciones || []).length) {
    html += `<div class="opts">${data.opciones.map((o) =>
      `<button class="optbtn" type="button" data-opt="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  }

  el.innerHTML = html;

  el.querySelectorAll(".cite[data-rule]").forEach((chip) => {
    chip.onclick = () => {
      const src = el.querySelector(`[data-src="${chip.dataset.rule}"]`);
      if (!src) return;
      const open = src.classList.toggle("hidden");
      chip.setAttribute("aria-expanded", String(!open));
    };
  });
  el.querySelectorAll("[data-opt]").forEach((b) => {
    b.onclick = () => { el.querySelectorAll(".opts").forEach((o) => o.remove()); send(b.dataset.opt); };
  });

  scroll();
}

function scroll() {
  requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }));
}

// ─── Envío ────────────────────────────────────────────────────────────────────
async function send(text) {
  if (S.busy || !text.trim()) return;
  S.busy = true;
  $("btnSend").disabled = true;
  $("q").value = "";
  autogrow();

  renderYou(text);
  const pending = renderPending();

  try {
    const res = await fetch(`${API}/api/ask`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Club-Key": S.clubKey },
      body: JSON.stringify({
        question: text,
        format: S.format,
        subformat: S.subformat,
        houseRules: S.houseRules,
        history: S.history.slice(-8),
      }),
    });
    const data = await res.json();

    if (!res.ok) {
      pending.innerHTML = `<div class="err">${esc(data.error || "Algo ha fallado.")}</div>`;
    } else {
      renderJudge(pending, data);
      S.history.push({ role: "tu", text });
      S.history.push({ role: "juez", text: data.texto });
    }
  } catch (e) {
    pending.innerHTML = `<div class="err">No he podido contactar con el servidor.
      Comprueba que tienes conexión y que la URL del Worker es correcta.</div>`;
  }

  S.busy = false;
  $("btnSend").disabled = false;
  $("q").focus();
}

function autogrow() {
  const t = $("q");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 160) + "px";
}

// ─── Arranque ─────────────────────────────────────────────────────────────────
paintFormats();
syncSetup();
$("subformat").value = S.subformat;
$("houseRules").value = S.houseRules;
$("clubKey").value = S.clubKey;

$("btnStart").onclick = start;
$("btnSend").onclick = () => send($("q").value);
$("q").oninput = autogrow;
$("q").onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("q").value); }
};
$("btnChange").onclick = () => {
  $("setup").classList.remove("hidden");
  $("chat").classList.add("hidden");
  $("composer").classList.add("hidden");
  $("btnChange").classList.add("hidden");
  $("ctxLabel").textContent = "";
  S.history = [];
  $("log").innerHTML = "";
};

// Pie: version de las reglas cargadas en el Worker
fetch(`${API}/api/health`)
  .then((r) => r.json())
  .then((d) => {
    $("foot").textContent =
      `Comprehensive Rules vigentes desde ${d.reglas?.effective || "?"} · ` +
      `${d.reglas?.rule_count || 0} reglas indexadas. ` +
      `Esto no sustituye a un juez en torneo.`;
  })
  .catch(() => {
    $("foot").textContent = "Esto no sustituye a un juez en torneo.";
  });
</script>
</body>
</html>
