name = "mtg-juez"
main = "src/index.js"
compatibility_date = "2026-08-01"

# El Worker sirve la web y la API a la vez. Cloudflare intenta primero servir un
# fichero estatico de esta carpeta; si la ruta no coincide con ninguno (por
# ejemplo /api/ask), ejecuta el codigo del Worker.
[assets]
directory = "./public"

# Base de datos de usuarios. Crea una D1 llamada "juez" en el panel de
# Cloudflare y pega aqui su identificador.
[[d1_databases]]
binding = "DB"
database_name = "juez"
database_id = "4925068d-13da-44ec-abe6-e4db292ae81b"

# Los secretos NO van aqui. Se ponen en el panel de Cloudflare:
#   GEMINI_API_KEY  clave de Google AI Studio
#   AUTH_PEPPER     cadena larga y aleatoria, la pimienta de las contrasenas
#   RESEND_API_KEY  clave de Resend para enviar correos
#   MAIL_FROM       remitente, p.ej. Juez <juez@tudominio.es>
