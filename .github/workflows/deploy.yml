name: Construir y desplegar

# Tres formas de dispararlo, todas sin tocar una consola:
#  - workflow_dispatch: el boton "Run workflow" en la pestana Actions
#  - push: cada vez que edites un fichero desde la web de GitHub
#  - schedule: cada lunes, por si Wizards ha publicado reglas nuevas
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar y trocear las Comprehensive Rules
        run: python tools/build_rules.py

      - name: Guardar las reglas si han cambiado
        run: |
          if git diff --quiet -- data/cr.json; then
            echo "Las reglas siguen igual."
          else
            python -c "import json;m=json.load(open('data/cr.json'))['meta'];print('Version vigente desde',m['effective'],'-',m['rule_count'],'reglas')"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add data/cr.json
            git commit -m "Reglas actualizadas [skip ci]"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Desplegar el Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install
          npx wrangler deploy
