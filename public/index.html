<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14100C">
<title>Juez · reglas de Magic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --table:#14100C;        /* el tapete */
  --frame:#33281B;        /* marco de carta, arriba */
  --frame-2:#211A11;      /* marco de carta, abajo */
  --edge:#0B0805;         /* filo exterior */
  --gold:#C9A227;         /* dorado de carta rara */
  --gold-soft:#E3CE93;
  --parchment:#F1E8D6;    /* caja de texto */
  --parchment-2:#E3D7BC;
  --ink:#1B1710;
  --ink-soft:#6B5E48;
  --rule:#B9A87F;         /* filetes sobre pergamino */
  --alert:#8C3A1E;
  --display:"Cinzel",Georgia,serif;
  --body:"Spectral",Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(120% 80% at 50% 0%, #1F1811 0%, var(--table) 65%),
    var(--table);
  background-attachment:fixed;
  color:var(--parchment); font-family:var(--body); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased; min-height:100dvh;
  display:flex; flex-direction:column;
}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px; border-radius:2px}
button{font:inherit; color:inherit; cursor:pointer}

/* ── cabecera ───────────────────────────────────────────── */
header{
  position:sticky; top:0; z-index:10;
  background:linear-gradient(#1B1610,#14100C);
  border-bottom:1px solid var(--gold);
  box-shadow:0 1px 0 rgba(201,162,39,.18), 0 8px 20px rgba(0,0,0,.5);
  padding:11px max(14px,env(safe-area-inset-left)) 11px max(14px,env(safe-area-inset-right));
  display:flex; align-items:center; gap:11px;
}
.mark{
  font-family:var(--display); font-weight:700; font-size:19px;
  letter-spacing:.22em; color:var(--gold-soft); line-height:1;
}
.pips{display:flex; gap:3px; align-items:center}
.pip{width:9px; height:9px; border-radius:50%; border:1px solid rgba(0,0,0,.5)}
.pip.w{background:#F7F0DA} .pip.u{background:#3B7BB5} .pip.b{background:#3A342C}
.pip.r{background:#B4413A} .pip.g{background:#4E8B54}
.ctx{margin-left:auto; display:flex; align-items:center; gap:11px; min-width:0}
.ctx-label{
  font-family:var(--display); font-size:12px; letter-spacing:.08em;
  color:var(--gold-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.linkbtn{
  background:none; border:none; padding:4px 2px; color:var(--gold);
  font-family:var(--display); font-size:12px; letter-spacing:.08em;
  text-decoration:underline; text-underline-offset:4px;
}

main{
  flex:1; width:100%; max-width:680px; margin:0 auto;
  padding:24px max(14px,env(safe-area-inset-left)) 8px max(14px,env(safe-area-inset-right));
}

/* ── pantalla de arranque ───────────────────────────────── */
.lede{
  font-family:var(--display); font-weight:600; font-size:27px; line-height:1.25;
  color:var(--gold-soft); margin:0 0 8px;
}
.sub{color:#9E9078; font-size:15px; margin:0 0 26px; max-width:46ch}
fieldset{border:none; margin:0 0 24px; padding:0}
legend{
  font-family:var(--display); font-size:11px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--gold); padding:0 0 12px;
}
.grid{display:grid; gap:9px}
.opt{
  display:flex; align-items:baseline; gap:10px; width:100%; text-align:left;
  background:linear-gradient(var(--parchment),var(--parchment-2));
  color:var(--ink); border:1px solid var(--edge); border-radius:5px;
  padding:12px 15px; box-shadow:0 1px 0 rgba(255,255,255,.35) inset;
  transition:box-shadow .14s, transform .14s;
}
.opt:hover{box-shadow:0 0 0 2px var(--gold), 0 1px 0 rgba(255,255,255,.35) inset}
.opt[aria-pressed="true"]{
  box-shadow:0 0 0 2px var(--gold), 0 1px 0 rgba(255,255,255,.35) inset;
  background:linear-gradient(#FBF4E4,#EDE2C9);
}
.opt b{font-family:var(--display); font-weight:600; font-size:15px}
.opt em{font-style:italic; color:var(--ink-soft); font-size:13.5px}
label.field{display:block; margin-bottom:18px}
label.field > span{
  display:block; font-family:var(--display); font-size:11px; letter-spacing:.18em;
  text-transform:uppercase; color:var(--gold); margin-bottom:7px;
}
input,select,textarea{
  width:100%; font-family:var(--body); font-size:15px; color:var(--ink);
  background:linear-gradient(var(--parchment),var(--parchment-2));
  border:1px solid var(--edge); border-radius:5px; padding:10px 12px;
}
textarea{resize:vertical; min-height:74px}
.hint{font-size:13px; color:#9E9078; font-style:italic; margin:7px 0 0}
.primary{
  width:100%; background:linear-gradient(#D8B23A,#A8841C); color:#1B1710;
  border:1px solid var(--edge); border-radius:5px; padding:13px;
  font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:.1em;
  text-transform:uppercase;
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset;
}
.primary:disabled{opacity:.4; cursor:not-allowed}

/* ── conversación ───────────────────────────────────────── */
.log{display:flex; flex-direction:column; gap:22px}
.turn-you{align-self:flex-end; max-width:86%}
.bubble{
  background:rgba(241,232,214,.07); border:1px solid rgba(201,162,39,.4);
  border-radius:5px; padding:9px 13px; font-size:15px; color:var(--parchment);
}
.cardtag{font-family:var(--display); font-size:.92em; color:var(--gold-soft)}

/* la respuesta del juez ES una carta */
.turn-judge{
  background:linear-gradient(var(--frame),var(--frame-2));
  border:1px solid var(--edge); border-radius:11px; padding:7px;
  box-shadow:0 0 0 1px rgba(201,162,39,.32) inset, 0 8px 22px rgba(0,0,0,.45);
  animation:deal .32s ease-out;
}
@keyframes deal{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){ .turn-judge{animation:none} }
.card-title{
  display:flex; align-items:center; gap:9px; padding:5px 9px 9px;
  font-family:var(--display); font-size:11.5px; font-weight:600;
  letter-spacing:.2em; text-transform:uppercase; color:var(--gold-soft);
}
.card-title .pips{margin-left:auto}
.textbox{
  background:linear-gradient(var(--parchment),var(--parchment-2));
  border:1px solid var(--edge); border-radius:6px;
  padding:15px 17px; color:var(--ink);
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset;
}
.answer{font-size:16px}
.answer p{margin:0 0 .75em}
.answer p:last-child{margin-bottom:0}

/* firma: la cita se abre como el texto recordatorio de una carta */
.cite{
  font-family:var(--display); font-size:12px; font-weight:600; letter-spacing:.04em;
  background:linear-gradient(#F7EFD9,#E8DCBE); border:1px solid var(--rule);
  border-radius:3px; padding:1px 6px; color:#6E5411; white-space:nowrap;
  vertical-align:1px;
}
button.cite:hover,button.cite[aria-expanded="true"]{
  background:linear-gradient(#F4E2AC,#E2CB85); border-color:#8A7328;
}
.sources{margin-top:14px}
.source{
  border-top:1px solid var(--rule); margin-top:10px; padding-top:10px;
  font-style:italic; font-size:14.5px; color:#4A4133; line-height:1.55;
}
.source .id{
  font-family:var(--display); font-style:normal; font-weight:600; font-size:12px;
  color:#6E5411; letter-spacing:.05em; margin-right:8px;
}
.hidden{display:none}

.opts{display:flex; flex-direction:column; gap:7px; margin-top:9px; padding:0 1px 1px}
.optbtn{
  text-align:left; background:linear-gradient(var(--parchment),var(--parchment-2));
  color:var(--ink); border:1px solid var(--edge); border-radius:5px;
  padding:11px 14px; font-size:15px;
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset;
}
.optbtn:hover{box-shadow:0 0 0 2px var(--gold), 0 1px 0 rgba(255,255,255,.35) inset}

.flag{
  margin-top:13px; font-size:14px; color:var(--alert); font-style:italic;
  border-left:3px solid var(--alert); padding:2px 0 2px 11px;
}
.cards{display:flex; gap:9px; margin-top:14px; flex-wrap:wrap}
.cards a{display:block; width:84px; text-decoration:none}
.cards img{width:100%; border-radius:4px; display:block; box-shadow:0 2px 7px rgba(0,0,0,.35)}
.cards span{
  font-family:var(--display); font-size:10.5px; color:var(--ink-soft);
  display:block; margin-top:5px; line-height:1.35;
}

.thinking{
  font-family:var(--display); font-size:13px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--ink-soft); padding:2px 0;
}
.thinking::after{content:"·"; animation:blink 1.1s steps(3,end) infinite}
@keyframes blink{0%{content:"·"}33%{content:"··"}66%{content:"···"}}
@media (prefers-reduced-motion:reduce){ .thinking::after{content:"···"; animation:none} }
.err{color:var(--alert); font-size:15px}
.detail{
  font-family:var(--body); font-size:12.5px; color:var(--ink-soft); font-style:italic;
  border-top:1px solid var(--rule); margin-top:9px; padding-top:9px;
  white-space:pre-wrap; word-break:break-word;
}

/* ── barra de escritura ─────────────────────────────────── */
.composer{
  position:sticky; bottom:0;
  background:linear-gradient(#14100C,#1B1610);
  border-top:1px solid var(--gold);
  box-shadow:0 -1px 0 rgba(201,162,39,.18), 0 -8px 20px rgba(0,0,0,.5);
  padding:11px max(14px,env(safe-area-inset-left)) max(11px,env(safe-area-inset-bottom));
}
.composer-inner{max-width:680px; margin:0 auto; display:flex; gap:9px; align-items:flex-end}
.composer textarea{min-height:46px; max-height:160px; overflow-y:hidden; line-height:1.45}
.send{
  background:linear-gradient(#D8B23A,#A8841C); color:#1B1710;
  border:1px solid var(--edge); border-radius:5px; padding:0 19px; height:46px;
  font-family:var(--display); font-weight:700; font-size:13px; letter-spacing:.12em;
  text-transform:uppercase; flex:0 0 auto;
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset;
}
.send:disabled{opacity:.4}
footer{
  max-width:680px; margin:0 auto; padding:12px 14px 22px;
  font-size:12px; color:#7D7159; font-style:italic; line-height:1.55; text-align:center;
}
</style>
</head>
<body>

<header>
  <div class="mark">JUEZ</div>
  <div class="pips" aria-hidden="true">
    <i class="pip w"></i><i class="pip u"></i><i class="pip b"></i><i class="pip r"></i><i class="pip g"></i>
  </div>
  <div class="ctx">
    <span class="ctx-label" id="ctxLabel"></span>
    <button class="linkbtn hidden" id="btnChange">Cambiar</button>
  </div>
</header>

<main>
  <section id="setup">
    <h1 class="lede">¿En qué estáis jugando?</h1>
    <p class="sub">Las reglas cambian según el formato. Dímelo una vez y no vuelvo a preguntar.</p>

    <fieldset>
      <legend>Formato</legend>
      <div class="grid" id="formats"></div>
    </fieldset>

    <label class="field hidden" id="subWrap">
      <span>Formato concreto</span>
      <select id="subformat">
        <option value="standard">Standard</option>
        <option value="pioneer">Pioneer</option>
        <option value="modern" selected>Modern</option>
        <option value="legacy">Legacy</option>
        <option value="vintage">Vintage</option>
        <option value="pauper">Pauper</option>
      </select>
      <p class="hint">Solo se usa para comprobar si una carta es legal.</p>
    </label>

    <label class="field hidden" id="houseWrap">
      <span>Acuerdos de mesa</span>
      <textarea id="houseRules" placeholder="Mulligan gratis el primero, no hay infinitos, proxies permitidas…"></textarea>
      <p class="hint">Lo que hayáis pactado en la Rule 0. Nunca sustituye a las reglas del juego.</p>
    </label>

    <label class="field hidden" id="keyWrap">
      <span>Clave del grupo</span>
      <input type="password" id="clubKey" autocomplete="off" placeholder="pídesela a quien te pasó esto">
      <p class="hint">Solo la primera vez. Se guarda en este dispositivo.</p>
    </label>

    <button class="primary" id="btnStart">Empezar</button>
  </section>

  <section id="chat" class="hidden">
    <div class="log" id="log"></div>
  </section>
</main>

<div class="composer hidden" id="composer">
  <div class="composer-inner">
    <textarea id="q" rows="1" placeholder="Escribe la duda. Para citar una carta: [[Lightning Bolt]]"></textarea>
    <button class="send" id="btnSend">Enviar</button>
  </div>
</div>

<footer id="foot"></footer>

<script>
// ─── Configuración ────────────────────────────────────────────────────────────
// La web y la API viven en el mismo Worker, así que no hay nada que configurar.
const API = "";

const FORMATS = [
  ["commander", "Commander", "Multijugador, 100 cartas, 40 vidas"],
  ["duel",      "Constructed 1 contra 1", "Standard, Pioneer, Modern, Legacy…"],
  ["limited",   "Limitado", "Draft o sellado, mazo de 40"],
  ["2hg",       "Gigante de dos cabezas", "Dos equipos de dos, vidas compartidas"],
  ["casual",    "Casual multijugador", "Todos contra todos"],
];

const PIPS = '<span class="pips" aria-hidden="true">' +
  ["w","u","b","r","g"].map((c) => `<i class="pip ${c}"></i>`).join("") + "</span>";

const S = {
  format: localStorage.getItem("mtg.format") || "",
  subformat: localStorage.getItem("mtg.subformat") || "modern",
  houseRules: localStorage.getItem("mtg.house") || "",
  clubKey: localStorage.getItem("mtg.key") || "",
  history: [],
  busy: false,
};

// La clave puede venir en el enlace: .../#k=loquesea
// Así se comparte una vez y nadie tiene que escribir nada nunca.
const fromLink = new URLSearchParams(location.hash.slice(1)).get("k");
if (fromLink) {
  S.clubKey = fromLink;
  localStorage.setItem("mtg.key", S.clubKey);
  history.replaceState(null, "", location.pathname + location.search);
}

const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ─── Pantalla de arranque ─────────────────────────────────────────────────────
function paintFormats() {
  $("formats").innerHTML = FORMATS.map(([id, name, desc]) =>
    `<button class="opt" type="button" data-fmt="${id}" aria-pressed="${S.format === id}">
       <b>${name}</b><em>${desc}</em>
     </button>`).join("");
  $("formats").querySelectorAll("[data-fmt]").forEach((b) => {
    b.onclick = () => { S.format = b.dataset.fmt; paintFormats(); syncSetup(); };
  });
}

function syncSetup() {
  $("subWrap").classList.toggle("hidden", S.format !== "duel");
  $("houseWrap").classList.toggle("hidden", S.format !== "commander" && S.format !== "casual");
  // Si ya tenemos la clave (guardada o venida por el enlace), no la pedimos
  $("keyWrap").classList.toggle("hidden", !!S.clubKey);
  $("btnStart").disabled = !S.format;
}

function contextLabel() {
  const f = FORMATS.find(([id]) => id === S.format);
  if (!f) return "";
  return S.format === "duel" ? `${f[1]} · ${S.subformat}` : f[1];
}

function start() {
  S.subformat = $("subformat").value;
  S.houseRules = $("houseRules").value.trim();
  if (!S.clubKey) S.clubKey = $("clubKey").value;
  localStorage.setItem("mtg.format", S.format);
  localStorage.setItem("mtg.subformat", S.subformat);
  localStorage.setItem("mtg.house", S.houseRules);
  localStorage.setItem("mtg.key", S.clubKey);

  $("setup").classList.add("hidden");
  $("chat").classList.remove("hidden");
  $("composer").classList.remove("hidden");
  $("btnChange").classList.remove("hidden");
  $("ctxLabel").textContent = contextLabel();
  $("q").focus();
}

// ─── Render de la conversación ────────────────────────────────────────────────
function renderYou(text) {
  const el = document.createElement("div");
  el.className = "turn-you";
  el.innerHTML = `<div class="bubble">${esc(text)
    .replace(/\[\[([^\]\n]{2,80})\]\]/g, '<span class="cardtag">$1</span>')}</div>`;
  $("log").append(el);
  scroll();
}

function renderPending() {
  const el = document.createElement("div");
  el.className = "turn-judge";
  el.innerHTML =
    `<div class="card-title">Juez${PIPS}</div>` +
    `<div class="textbox"><div class="thinking">Consultando las reglas</div></div>`;
  $("log").append(el);
  scroll();
  return el;
}

/**
 * Convierte [CR 603.3a] en una pastilla que abre el texto literal de la regla.
 * Acepta también varios números en un mismo corchete: [CR 304.2, CR 608.2n].
 */
const RULE_REF = /\d{3}\.\d+[a-z]?/;
const CITATION = new RegExp(
  "\\[\\s*(?:CR\\s*)?" + RULE_REF.source +
  "(?:\\s*[,;y]+\\s*(?:CR\\s*)?" + RULE_REF.source + ")*\\s*\\]",
  "gi"
);

function withCitations(text, sources) {
  const known = new Set(sources.map((s) => s.id));
  return esc(text).replace(CITATION, (bloque) => {
    const ids = bloque.match(new RegExp(RULE_REF.source, "g")) || [];
    return ids
      .map((id) =>
        known.has(id)
          ? `<button class="cite" type="button" data-rule="${id}" aria-expanded="false">${id}</button>`
          : `<span class="cite">${id}</span>`
      )
      .join(" ");
  });
}

function renderJudge(el, data) {
  const sources = data.fuentes || [];
  const paras = String(data.texto || "")
    .split(/\n{2,}/)
    .map((p) => `<p>${withCitations(p, sources).replace(/\n/g, "<br>")}</p>`)
    .join("");

  let box = `<div class="answer">${paras}</div>`;

  // En una clarificación la confianza baja no significa "las reglas no lo
  // cubren", solo que faltan datos. Enseñar el aviso ahí confunde más que ayuda.
  if (data.confianza === "baja" && data.tipo !== "clarificacion") {
    box += `<div class="flag">Poca confianza: las reglas que he encontrado no cubren bien
            este caso. Si la partida es seria, contrastadlo con un juez o con el
            documento oficial.</div>`;
  }

  const cards = (data.cartas || []).filter((c) => c.found && c.image);
  if (cards.length) {
    box += `<div class="cards">${cards.map((c) =>
      `<a href="${c.scryfall_uri}" target="_blank" rel="noopener">
         <img src="${c.image}" alt="${esc(c.name)}" loading="lazy">
         <span>${esc(c.printed_name || c.name)}${c.legality && c.legality !== "legal" ? " · " + c.legality : ""}</span>
       </a>`).join("")}</div>`;
  }

  const missing = (data.cartas || []).filter((c) => !c.found);
  if (missing.length) {
    box += `<div class="flag">No encuentro en Scryfall: ${missing.map((c) => esc(c.query)).join(", ")}.
            Revisa el nombre exacto.</div>`;
  }

  if (sources.length) {
    box += `<div class="sources">${sources.map((s) =>
      `<div class="source hidden" data-src="${s.id}">
         <span class="id">${s.id}</span>${esc(s.text)}
       </div>`).join("")}</div>`;
  }

  let html =
    `<div class="card-title">Juez${PIPS}</div>` +
    `<div class="textbox">${box}</div>`;

  if (data.tipo === "clarificacion" && (data.opciones || []).length) {
    html += `<div class="opts">${data.opciones.map((o) =>
      `<button class="optbtn" type="button" data-opt="${esc(o)}">${esc(o)}</button>`).join("")}</div>`;
  }

  el.innerHTML = html;

  el.querySelectorAll(".cite[data-rule]").forEach((chip) => {
    chip.onclick = () => {
      const src = el.querySelector(`[data-src="${chip.dataset.rule}"]`);
      if (!src) return;
      const oculto = src.classList.toggle("hidden");
      chip.setAttribute("aria-expanded", String(!oculto));
    };
  });
  el.querySelectorAll("[data-opt]").forEach((b) => {
    b.onclick = () => { el.querySelectorAll(".opts").forEach((o) => o.remove()); send(b.dataset.opt); };
  });

  scroll();
}

function renderError(el, error, detail) {
  el.innerHTML =
    `<div class="card-title">Juez${PIPS}</div>` +
    `<div class="textbox"><div class="err">${esc(error)}</div>` +
    (detail ? `<div class="detail">${esc(detail)}</div>` : "") +
    `</div>`;
  scroll();
}

function scroll() {
  requestAnimationFrame(() =>
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }));
}

// ─── Envío ────────────────────────────────────────────────────────────────────
async function send(text) {
  if (S.busy || !text.trim()) return;
  S.busy = true;
  $("btnSend").disabled = true;
  $("q").value = "";
  autogrow();

  renderYou(text);
  const pending = renderPending();

  try {
    const res = await fetch(`${API}/api/ask`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Club-Key": S.clubKey },
      body: JSON.stringify({
        question: text,
        format: S.format,
        subformat: S.subformat,
        houseRules: S.houseRules,
        history: S.history.slice(-8),
      }),
    });
    const data = await res.json();

    if (!res.ok) {
      renderError(pending, data.error || "Algo ha fallado.", data.detail);
    } else {
      renderJudge(pending, data);
      S.history.push({ role: "tu", text });
      S.history.push({ role: "juez", text: data.texto });
    }
  } catch (e) {
    renderError(pending, "No he podido contactar con el servidor.",
      "Comprueba tu conexión y vuelve a intentarlo.");
  }

  S.busy = false;
  $("btnSend").disabled = false;
  $("q").focus();
}

function autogrow() {
  const t = $("q");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 160) + "px";
  // Solo mostramos la barra cuando el texto no cabe de verdad
  t.style.overflowY = t.scrollHeight > 160 ? "auto" : "hidden";
}

// ─── Arranque ─────────────────────────────────────────────────────────────────
paintFormats();
syncSetup();
$("subformat").value = S.subformat;
$("houseRules").value = S.houseRules;

$("btnStart").onclick = start;
$("btnSend").onclick = () => send($("q").value);
$("q").oninput = autogrow;
$("q").onkeydown = (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("q").value); }
};
$("btnChange").onclick = () => {
  $("setup").classList.remove("hidden");
  $("chat").classList.add("hidden");
  $("composer").classList.add("hidden");
  $("btnChange").classList.add("hidden");
  $("ctxLabel").textContent = "";
  S.history = [];
  $("log").innerHTML = "";
  syncSetup();
};

fetch(`${API}/api/health`)
  .then((r) => r.json())
  .then((d) => {
    $("foot").textContent =
      `Comprehensive Rules vigentes desde ${d.reglas?.effective || "?"} · ` +
      `${d.reglas?.rule_count || 0} reglas indexadas. ` +
      `Esto no sustituye a un juez en torneo.`;
  })
  .catch(() => {
    $("foot").textContent = "Esto no sustituye a un juez en torneo.";
  });
</script>
</body>
</html>
