name: Construir y desplegar

# Tres formas de dispararlo, todas sin tocar una consola:
#  - workflow_dispatch: el boton "Run workflow" en la pestana Actions
#  - push: cada vez que edites un fichero desde la web de GitHub
#  - schedule: cada lunes, por si Wizards ha publicado reglas nuevas
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"

# Solo lectura: este workflow ya no escribe en el repositorio.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # data/cr.json se genera aqui en cada ejecucion y viaja dentro del bundle
      # del Worker. No se commitea: el fichero lleva la fecha de generacion, asi
      # que cambiaria en cada run y los commits automaticos acabarian pisandose
      # entre ellos. La version desplegada se consulta en /api/health.
      - name: Descargar y trocear las Comprehensive Rules
        run: python tools/build_rules.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Desplegar el Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # GitHub guarda los secretos tal cual: si al copiarlos se cuela un
          # espacio o un salto de linea, viaja hasta aqui. Los recortamos.
          CLEAN_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          CLEAN_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"

          echo "Account ID: ${#CLEAN_ID} caracteres. Token: ${#CLEAN_TOKEN} caracteres."

          if [ -z "$CLEAN_ID" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_ACCOUNT_ID en el repositorio."
            exit 1
          fi
          # Esto es lo unico que Cloudflare rechaza de plano.
          if ! printf '%s' "$CLEAN_ID" | grep -qE '^[A-Za-z0-9_-]+$'; then
            echo "::error::El Account ID tiene caracteres que Cloudflare no acepta."
            echo "Solo admite letras, numeros, guiones y guiones bajos."
            echo "Sacalo de la barra de direcciones del panel de Cloudflare:"
            echo "  https://dash.cloudflare.com/ESTO_DE_AQUI/workers"
            exit 1
          fi
          # Los IDs reales son 32 caracteres hexadecimales. Si no lo parece,
          # avisamos pero seguimos: mas vale intentarlo que bloquear sin motivo.
          if ! printf '%s' "$CLEAN_ID" | grep -qE '^[0-9a-fA-F]{32}$'; then
            echo "::warning::El Account ID no tiene la pinta habitual (32 hexadecimales)."
            echo "::warning::Tiene ${#CLEAN_ID} caracteres. Revisa que no sea el token por error."
          fi
          if [ -z "$CLEAN_TOKEN" ]; then
            echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN en el repositorio."
            exit 1
          fi

          export CLOUDFLARE_ACCOUNT_ID="$CLEAN_ID"
          export CLOUDFLARE_API_TOKEN="$CLEAN_TOKEN"

          npm install

          # Si ya has enlazado la base de datos, aplicamos el esquema. Todas las
          # sentencias llevan IF NOT EXISTS, asi que repetirlo no rompe nada ni
          # toca los datos existentes. Si aun no la has creado, se salta.
          if grep -q 'database_id = "PEGA_AQUI' wrangler.toml; then
            echo "Sin base de datos enlazada todavia: me salto el esquema."
          else
            echo "Aplicando schema.sql a la base de datos D1..."
            npx wrangler d1 execute juez --remote --file=schema.sql --yes

            # Columnas anadidas despues de la primera version. SQLite no tiene
            # "ADD COLUMN IF NOT EXISTS", asi que en una base ya migrada esto
            # falla con "duplicate column name" y no pasa nada: lo toleramos.
            echo "Aplicando migraciones (los errores de columna repetida son normales)..."
            npx wrangler d1 execute juez --remote --file=migrate.sql --yes \
              || echo "  migraciones ya aplicadas"
          fi

          npx wrangler deploy
